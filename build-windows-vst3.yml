name: Build Windows VST3

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -A x64

      - name: Build (Release)
        run: cmake --build build --config Release --parallel

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item -Recurse "build/VoiceEnhance_artefacts/Release/VST3/An-Niyamah Voice Enhance.vst3" "dist/"
          Copy-Item install_vst3.bat dist/
          Copy-Item README.txt dist/

      - uses: actions/upload-artifact@v4
        with:
          name: AnNiyamah-VoiceEnhance-VST3-Windows
          path: dist
